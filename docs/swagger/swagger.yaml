definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResult:
    properties:
      currentOrgId:
        type: string
      tokenPair:
        $ref: '#/definitions/jwt.TokenPair'
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        maxLength: 32
        minLength: 8
        type: string
      phone:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      email:
        type: string
      message:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  jwt.TokenPair:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
    type: object
  productionunit.ArchiveCommand:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  productionunit.AreaInput:
    properties:
      unit:
        $ref: '#/definitions/productionunit.AreaUnit'
      value:
        type: number
    required:
    - unit
    - value
    type: object
  productionunit.AreaUnit:
    enum:
    - M2
    - HECTARE
    - SOTKA
    type: string
    x-enum-comments:
      Hectares: 1 га = 10 000 м²
      Sotka: 1 сотка (ар) = 100 м²
    x-enum-descriptions:
    - ""
    - 1 га = 10 000 м²
    - 1 сотка (ар) = 100 м²
    x-enum-varnames:
    - SquareMeters
    - Hectares
    - Sotka
  productionunit.ConfigureCommand:
    properties:
      id:
        type: string
      schema:
        $ref: '#/definitions/productionunit.LayoutSchema'
    type: object
  productionunit.CreateCommand:
    properties:
      area:
        $ref: '#/definitions/productionunit.AreaInput'
      capabilities:
        items:
          enum:
          - soil
          - irrigation
          - fertigation
          - drainage
          - hydroponic
          - aeroponic
          - nutrientControl
          - lighting
          - climateControl
          - sensorSupport
          - automation
          - slotBased
          - mobile
          type: string
        type: array
      dimensions:
        $ref: '#/definitions/productionunit.Dimensions'
      geometry:
        $ref: '#/definitions/valueobject.Geometry'
      name:
        type: string
      parentId:
        type: string
      type:
        $ref: '#/definitions/productionunit.ProductionUnitType'
    required:
    - name
    - type
    type: object
  productionunit.DTO:
    properties:
      area:
        type: number
      children:
        items:
          $ref: '#/definitions/productionunit.DTO'
        type: array
      code:
        type: string
      geometry:
        $ref: '#/definitions/valueobject.Geometry'
      id:
        type: string
      parentId:
        type: string
      properties:
        additionalProperties: {}
        type: object
      status:
        type: string
      type:
        type: string
    type: object
  productionunit.Dimensions:
    properties:
      capacity:
        type: number
      cellCount:
        type: integer
      diameter:
        type: number
      height:
        type: number
      length:
        type: number
      levels:
        type: integer
      slots:
        type: integer
      volume:
        type: number
      width:
        type: number
    type: object
  productionunit.Element:
    properties:
      id:
        type: string
      length:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/productionunit.ProductionUnitType'
      width:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  productionunit.GetOneQuery:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  productionunit.LayoutSchema:
    properties:
      beds:
        items:
          $ref: '#/definitions/productionunit.Element'
        type: array
    type: object
  productionunit.ProductionUnitType:
    enum:
    - FIELD
    - PLOT
    - BLOCK
    - BED
    - ROW
    - GREENHOUSE
    - GREENHOUSE_ZONE
    - CONTAINER
    - RACK
    - SHELF
    - VERTICAL_TOWER
    - SLOT
    - POT
    - TRAY
    - NFT_CHANNEL
    - DWC_TANK
    - AEROPONIC_CHAMBER
    - RESERVOIR
    - STORAGE
    type: string
    x-enum-varnames:
    - Field
    - Plot
    - Block
    - Bed
    - Row
    - Greenhouse
    - GreenhouseZone
    - Container
    - Rack
    - Shelf
    - VerticalTower
    - Slot
    - Pot
    - Tray
    - NFTChannel
    - DWCTank
    - AeroChamber
    - Reservoir
    - Storage
  productionunit.UpdateCommand:
    properties:
      id:
        type: string
      schema:
        items:
          type: integer
        type: array
    type: object
  response.ErrResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorInfo'
      success:
        type: boolean
    type: object
  response.ErrorInfo:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  response.IdResponse:
    properties:
      id:
        type: string
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  valueobject.Coordinates:
    properties:
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  valueobject.Dimension:
    properties:
      height:
        type: number
      length:
        type: number
      width:
        type: number
    type: object
  valueobject.Geometry:
    properties:
      dimension:
        $ref: '#/definitions/valueobject.Dimension'
      polygon:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      position:
        $ref: '#/definitions/valueobject.Coordinates'
      type:
        $ref: '#/definitions/valueobject.GeometryType'
    type: object
  valueobject.GeometryType:
    enum:
    - RECT
    - POLYGON
    - POINT
    type: string
    x-enum-varnames:
    - Rect
    - Polygon
    - Point
host: localhost:8080
info:
  contact: {}
  description: |-
    CQRS-style API. У каждой команды/запроса — свой путь вида
    /api/commands/{name} или /api/queries/{name}, тело = data.
  title: Agro Platform API
  version: "1.0"
paths:
  /api/commands/spatial.archive_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID узла
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.ArchiveCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "404":
          description: Узел не найден
          schema:
            $ref: '#/definitions/response.ErrResponse'
        "409":
          description: Есть неархивные дети
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Архивировать узел
      tags:
      - spatial
  /api/commands/spatial.configure_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID родителя и схема раскладки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.ConfigureCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Сгенерировать схему узла
      tags:
      - spatial
  /api/commands/spatial.create_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Параметры узла
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.CreateCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать узел
      tags:
      - spatial
  /api/commands/spatial.update_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID узла и схема
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.UpdateCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Обновить схему узла
      tags:
      - spatial
  /api/queries/spatial.get_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID узла
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.GetOneQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/productionunit.DTO'
              type: object
      security:
      - BearerAuth: []
      summary: Получить узел вместе с поддеревом
      tags:
      - spatial
  /api/queries/spatial.get_production_unit_children:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/productionunit.DTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Список детских узлов
      tags:
      - spatial
  /api/queries/spatial.list_production_units:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/productionunit.DTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Список корневых узлов организации (с вложенными деревьями)
      tags:
      - spatial
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrResponse'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh-токен
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Выход (текущая реализация — заглушка, blacklist токенов не ведётся)
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrResponse'
      summary: Регистрация
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'JWT из POST /auth/login. Формат: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
