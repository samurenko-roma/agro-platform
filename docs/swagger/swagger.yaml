host: api.lab.note
info:
  contact: {}
  description: |-
    CQRS-style API. Все команды — POST /api/commands с телом
    {"command": "<name>", "data": {...}}; все запросы — POST
    /api/queries с телом {"query": "<name>", "data": {...}}.
    Каждая операция ниже задокументирована как отдельный путь
    для читаемости; "Try it out" отправляет уже переписанный,
    реальный запрос.
  title: Agro Platform API
  version: "1.0"
paths:
  /api/commands/account.create_organization:
    post:
      consumes:
      - application/json
      description: 'Можно вызвать напрямую этим путём (тело = data), либо через POST
        /api/commands с конвертом {"command": "account.create_organization", "data":
        {...}}'
      parameters:
      - description: Название организации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.CreateOrganizationCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommandResponse'
      security:
      - BearerAuth: []
      summary: Создать организацию (ферму/хозяйство), пользователь становится владельцем
      tags:
      - account
  /api/commands/account.switch_organization:
    post:
      consumes:
      - application/json
      description: 'Можно вызвать напрямую этим путём (тело = data), либо через POST
        /api/commands с конвертом {"command": "account.switch_organization", "data":
        {...}}'
      parameters:
      - description: ID организации, в которой есть членство
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.SwitchOrganizationCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommandResponse'
        "403":
          description: нет членства в организации
          schema:
            $ref: '#/definitions/response.CommandResponse'
      security:
      - BearerAuth: []
      summary: Переключиться на другую организацию (перевыпускает JWT с новым organization_id)
      tags:
      - account
  /api/commands/agronomy.create_crop:
    post:
      consumes:
      - application/json
      description: 'Реальный вызов: POST /api/commands, {"command": "agronomy.create_crop",
        "data": <тело ниже>}'
      parameters:
      - description: Название, категория, семейство, агрономический профиль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crop.CreateCropCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommandResponse'
        "409":
          description: культура с таким именем уже существует
          schema:
            $ref: '#/definitions/response.CommandResponse'
      security:
      - BearerAuth: []
      summary: 'Создать культуру в справочнике (Crop) — биология вида: температуры,
        GDD, водопотребление'
      tags:
      - agronomy
  /api/commands/agronomy.create_season:
    post:
      consumes:
      - application/json
      description: 'Реальный вызов: POST /api/commands, {"command": "agronomy.create_season",
        "data": <тело ниже>}'
      parameters:
      - description: Название, даты начала/конца, статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/season.CreateSeasonCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommandResponse'
      security:
      - BearerAuth: []
      summary: Создать агрономический сезон (период планирования)
      tags:
      - agronomy
  /api/commands/agronomy.create_variety:
    post:
      consumes:
      - application/json
      description: 'Реальный вызов: POST /api/commands, {"command": "agronomy.create_variety",
        "data": <тело ниже>}'
      parameters:
      - description: Название, ID культуры, дни до созревания
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/variety.CreateVarietyCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommandResponse'
        "404":
          description: культура не найдена
          schema:
            $ref: '#/definitions/response.CommandResponse'
        "409":
          description: сорт с таким именем уже существует у этой культуры
          schema:
            $ref: '#/definitions/response.CommandResponse'
      security:
      - BearerAuth: []
      summary: Создать сорт культуры (Variety) — конкретный коммерческий сорт с зрелостью/спейсингом
      tags:
      - agronomy
  /api/commands/inventory.archive_warehouse:
