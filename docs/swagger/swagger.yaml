definitions:
  account.MeResponse:
    properties:
      currentOrgId:
        type: string
      organizations:
        items:
          $ref: '#/definitions/dto.UserOrganizationInfo'
        type: array
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResult:
    properties:
      currentOrgId:
        type: string
      tokenPair:
        $ref: '#/definitions/jwt.TokenPair'
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        maxLength: 32
        minLength: 8
        type: string
      phone:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      email:
        type: string
      message:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  crop.AgronomyProfile:
    properties:
      lightRequirement:
        $ref: '#/definitions/crop.LightRequirement'
      maturity:
        $ref: '#/definitions/valueobject.Maturity'
      phenophaseGDD:
        items:
          $ref: '#/definitions/crop.PhenophaseGDD'
        type: array
      thermalRequirements:
        $ref: '#/definitions/crop.ThermalRequirements'
      tolerance:
        $ref: '#/definitions/crop.Tolerance'
      waterRequirement:
        $ref: '#/definitions/crop.WaterRequirement'
    type: object
  crop.CreateCropCommand:
    properties:
      agronomy:
        $ref: '#/definitions/crop.AgronomyProfile'
      category:
        type: string
      description:
        type: string
      family:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  crop.Detail:
    properties:
      agronomy:
        type: string
      category:
        type: string
      family:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/valueobject.Metadata'
      name:
        type: string
    type: object
  crop.LightRequirement:
    properties:
      dayLengthMin:
        format: int32
        type: integer
      dayLengthOpt:
        format: int32
        type: integer
      photoperiodType:
        type: string
      ppfdmin:
        type: integer
      ppfdopt:
        type: integer
    type: object
  crop.ListItem:
    properties:
      category:
        type: string
      family:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      name:
        type: string
    type: object
  crop.ListQuery:
    properties:
      archived:
        type: boolean
      categories:
        items:
          type: string
        type: array
      search:
        type: string
    type: object
  crop.OneQuery:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  crop.PhenophaseGDD:
    properties:
      code:
        description: '"BBCH-10"'
        type: string
      description:
        description: описание фазы
        type: string
      gddrequired:
        description: накопленное GDD для достижения
        format: float64
        type: number
      isCritical:
        description: критическая фаза?
        type: boolean
      name:
        description: '"Первый настоящий лист"'
        type: string
    type: object
  crop.ThermalRequirements:
    properties:
      baseTemperature:
        format: float64
        type: number
      upperTemperature:
        format: float64
        type: number
    type: object
  crop.Tolerance:
    properties:
      humidityMax:
        format: int32
        type: integer
      humidityMin:
        format: int32
        type: integer
      temperatureMax:
        format: int32
        type: integer
      temperatureMin:
        format: int32
        type: integer
    type: object
  crop.WaterRequirement:
    properties:
      dailyNeedMin:
        format: float64
        type: number
      dailyNeedOpt:
        format: float64
        type: number
    type: object
  dto.UserOrganizationInfo:
    properties:
      id:
        type: string
      name:
        type: string
      role:
        type: string
      roleName:
        type: string
    type: object
  github_com_samurenkoroma_agro-platform_internal_application_queries_agronomy_variety.LightRequirement:
    properties:
      criticalPhases:
        items:
          type: string
        type: array
      dayLengthMin:
        type: integer
      dayLengthOpt:
        type: integer
      photoperiodType:
        type: string
      ppfdMin:
        type: integer
      ppfdOpt:
        type: integer
    type: object
  github_com_samurenkoroma_agro-platform_internal_application_queries_agronomy_variety.WaterRequirement:
    properties:
      criticalPhases:
        items:
          type: string
        type: array
      dailyNeedMin:
        type: integer
      dailyNeedOpt:
        type: integer
    type: object
  jwt.TokenPair:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
    type: object
  organization.CreateOrganizationCmd:
    properties:
      name:
        type: string
    type: object
  organization.SwitchOrganizationCmd:
    properties:
      organization_id:
        type: string
    type: object
  organization.SwitchOrganizationResult:
    properties:
      currentOrg:
        $ref: '#/definitions/dto.UserOrganizationInfo'
      tokenPair:
        $ref: '#/definitions/jwt.TokenPair'
    type: object
  productionunit.ArchiveCommand:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  productionunit.AreaInput:
    properties:
      unit:
        $ref: '#/definitions/productionunit.AreaUnit'
      value:
        type: number
    required:
    - unit
    - value
    type: object
  productionunit.AreaUnit:
    enum:
    - M2
    - HECTARE
    - SOTKA
    type: string
    x-enum-comments:
      Hectares: 1 га = 10 000 м²
      Sotka: 1 сотка (ар) = 100 м²
    x-enum-descriptions:
    - ""
    - 1 га = 10 000 м²
    - 1 сотка (ар) = 100 м²
    x-enum-varnames:
    - SquareMeters
    - Hectares
    - Sotka
  productionunit.ConfigureCommand:
    properties:
      id:
        type: string
      schema:
        $ref: '#/definitions/productionunit.LayoutSchema'
    type: object
  productionunit.CreateCommand:
    properties:
      area:
        $ref: '#/definitions/productionunit.AreaInput'
      capabilities:
        items:
          enum:
          - soil
          - irrigation
          - fertigation
          - drainage
          - hydroponic
          - aeroponic
          - nutrientControl
          - lighting
          - climateControl
          - sensorSupport
          - automation
          - slotBased
          - mobile
          type: string
        type: array
      dimensions:
        $ref: '#/definitions/productionunit.Dimensions'
      geometry:
        $ref: '#/definitions/valueobject.Geometry'
      name:
        type: string
      parentId:
        type: string
      type:
        $ref: '#/definitions/productionunit.ProductionUnitType'
    required:
    - name
    - type
    type: object
  productionunit.DTO:
    properties:
      area:
        type: number
      children:
        items:
          $ref: '#/definitions/productionunit.DTO'
        type: array
      code:
        type: string
      geometry:
        $ref: '#/definitions/valueobject.Geometry'
      id:
        type: string
      parentId:
        type: string
      properties:
        additionalProperties: {}
        type: object
      status:
        type: string
      type:
        type: string
    type: object
  productionunit.Dimensions:
    properties:
      capacity:
        type: number
      cellCount:
        type: integer
      diameter:
        type: number
      height:
        type: number
      length:
        type: number
      levels:
        type: integer
      slots:
        type: integer
      volume:
        type: number
      width:
        type: number
    type: object
  productionunit.Element:
    properties:
      id:
        type: string
      length:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/productionunit.ProductionUnitType'
      width:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  productionunit.GetOneQuery:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  productionunit.LayoutSchema:
    properties:
      beds:
        items:
          $ref: '#/definitions/productionunit.Element'
        type: array
    type: object
  productionunit.ProductionUnitType:
    enum:
    - FIELD
    - PLOT
    - BLOCK
    - BED
    - ROW
    - GREENHOUSE
    - GREENHOUSE_ZONE
    - CONTAINER
    - RACK
    - SHELF
    - VERTICAL_TOWER
    - SLOT
    - POT
    - TRAY
    - NFT_CHANNEL
    - DWC_TANK
    - AEROPONIC_CHAMBER
    - RESERVOIR
    - STORAGE
    type: string
    x-enum-varnames:
    - Field
    - Plot
    - Block
    - Bed
    - Row
    - Greenhouse
    - GreenhouseZone
    - Container
    - Rack
    - Shelf
    - VerticalTower
    - Slot
    - Pot
    - Tray
    - NFTChannel
    - DWCTank
    - AeroChamber
    - Reservoir
    - Storage
  productionunit.UpdateCommand:
    properties:
      id:
        type: string
      schema:
        items:
          type: integer
        type: array
    type: object
  response.ErrResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorInfo'
      success:
        type: boolean
    type: object
  response.ErrorInfo:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  response.IdResponse:
    properties:
      id:
        type: string
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  season.CreateSeasonCmd:
    properties:
      description:
        type: string
      endDate:
        type: string
      name:
        type: string
      startDate:
        type: string
      status:
        type: string
    required:
    - endDate
    - name
    - startDate
    - status
    type: object
  valueobject.Coordinates:
    properties:
      x:
        type: number
      "y":
        type: number
      z:
        type: number
    type: object
  valueobject.Dimension:
    properties:
      height:
        type: number
      length:
        type: number
      width:
        type: number
    type: object
  valueobject.Geometry:
    properties:
      dimension:
        $ref: '#/definitions/valueobject.Dimension'
      polygon:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      position:
        $ref: '#/definitions/valueobject.Coordinates'
      type:
        $ref: '#/definitions/valueobject.GeometryType'
    type: object
  valueobject.GeometryType:
    enum:
    - RECT
    - POLYGON
    - POINT
    type: string
    x-enum-varnames:
    - Rect
    - Polygon
    - Point
  valueobject.Maturity:
    properties:
      daysToHarvest:
        type: integer
      gddtoHarvest:
        format: float64
        type: number
    type: object
  valueobject.Metadata:
    additionalProperties: {}
    type: object
  variety.CreateVarietyCommand:
    properties:
      cropId:
        type: string
      daysToMaturity:
        type: integer
      name:
        type: string
    required:
    - cropId
    - daysToMaturity
    - name
    type: object
  variety.Detail:
    properties:
      baseTemperature:
        format: float64
        type: number
      daysToMaturity:
        type: integer
      description:
        type: string
      growingTypes:
        items:
          type: string
        type: array
      id:
        type: string
      image:
        type: string
      lightRequirement:
        $ref: '#/definitions/github_com_samurenkoroma_agro-platform_internal_application_queries_agronomy_variety.LightRequirement'
      maxTemperature:
        format: float64
        type: number
      name:
        type: string
      phenophaseGDD:
        items:
          $ref: '#/definitions/variety.Phenophase'
        type: array
      speciesKey:
        type: string
      speciesName:
        type: string
      waterRequirement:
        $ref: '#/definitions/github_com_samurenkoroma_agro-platform_internal_application_queries_agronomy_variety.WaterRequirement'
      yieldPotential:
        type: string
    type: object
  variety.ListItem:
    properties:
      cropId:
        type: string
      cropName:
        type: string
      daysToMaturity:
        type: integer
      id:
        type: string
      name:
        type: string
    type: object
  variety.ListQuery:
    properties:
      cropId:
        description: tomato, eggplant, cucumber
        type: string
    type: object
  variety.OneQuery:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  variety.Phenophase:
    properties:
      code:
        type: string
      description:
        type: string
      gddRequired:
        type: integer
      isCritical:
        type: boolean
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    CQRS-style API. У каждой команды/запроса — свой путь вида
    /api/commands/{name} или /api/queries/{name}, тело = data.
  title: Agro Platform API
  version: "1.0"
paths:
  /api/commands/account.create_organization:
    post:
      consumes:
      - application/json
      description: Создать организацию (ферму/хозяйство), пользователь становится
        владельцем
      parameters:
      - description: Название организации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.CreateOrganizationCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserOrganizationInfo'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать организацию
      tags:
      - account
  /api/commands/account.switch_organization:
    post:
      consumes:
      - application/json
      description: Переключиться на другую организацию (перевыпускает JWT с новым
        organization_id)
      parameters:
      - description: ID организации, в которой есть членство
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.SwitchOrganizationCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/organization.SwitchOrganizationResult'
              type: object
        "403":
          description: нет членства в организации
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Переключиться на другую организацию
      tags:
      - account
  /api/commands/agronomy.create_crop:
    post:
      consumes:
      - application/json
      description: 'Создать культуру в справочнике (Crop) — биология вида: температуры,
        GDD, водопотребление'
      parameters:
      - description: Название, категория, семейство, агрономический профиль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crop.CreateCropCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать культуру
      tags:
      - agronomy
  /api/commands/agronomy.create_season:
    post:
      consumes:
      - application/json
      description: Создать агрономический сезон (период планирования)
      parameters:
      - description: Название, даты начала/конца, статус
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/season.CreateSeasonCmd'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "409":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать агрономический сезон (период планирования)
      tags:
      - agronomy
  /api/commands/agronomy.create_variety:
    post:
      consumes:
      - application/json
      description: Создать сорт культуры (Variety) — конкретный коммерческий сорт
        с зрелостью/спейсингом
      parameters:
      - description: Название, ID культуры, дни до созревания
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/variety.CreateVarietyCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrResponse'
        "409":
          description: сорт с таким именем уже существует у этой культуры
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать сорт культуры
      tags:
      - agronomy
  /api/commands/spatial.archive_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID узла
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.ArchiveCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "404":
          description: Узел не найден
          schema:
            $ref: '#/definitions/response.ErrResponse'
        "409":
          description: Есть неархивные дети
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Архивировать узел
      tags:
      - spatial
  /api/commands/spatial.configure_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID родителя и схема раскладки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.ConfigureCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Сгенерировать схему узла
      tags:
      - spatial
  /api/commands/spatial.create_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: Параметры узла
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.CreateCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/response.ErrResponse'
      security:
      - BearerAuth: []
      summary: Создать узел
      tags:
      - spatial
  /api/commands/spatial.update_production_unit:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID узла и схема
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/productionunit.UpdateCommand'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.IdResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Обновить схему узла
      tags:
      - spatial
  /api/queries/account.me:
    post:
      consumes:
      - application/json
      description: Текущий пользователь + список организаций, в которых он состоит
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/account.MeResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - account
  /api/queries/agronomy.get_crop:
    post:
      consumes:
      - application/json
      description: 'Реальный вызов: POST /api/queries, {"query": "agronomy.get_crop",
        "data": <тело ниже>}'
      parameters:
      - description: ID культуры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/crop.OneQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/crop.Detail'
              type: object
      security:
      - BearerAuth: []
      summary: Получить культуру по ID
      tags:
      - agronomy
  /api/queries/agronomy.get_variety:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID сорта
        in: body
